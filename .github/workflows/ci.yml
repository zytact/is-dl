name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '24'
          cache: true
      - run: vp install
      - uses: actions/cache@v4
        with:
          path: node_modules/.vite/task-cache
          key: vite-task-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'vite.config.ts', 'package.json', 'apps/*/package.json') }}
          restore-keys: |
            vite-task-${{ runner.os }}-
      - run: vp run check
      - run: vp run test
      - run: vp run build
